; Configuração do Emissor de Autorização.
; Este arquivo deve ficar na MESMA pasta do EmissorAutorizacaoOnibus.exe.
; Depois de alterar, basta fechar e abrir o programa de novo (não precisa gerar outro .exe).

[armazenamento]
; Caminho de rede (UNC) da pasta onde os documentos são salvos.
caminho = \\SRV-ARQ\Autorizacoes

[validacao]
; Endereço da página de validação aberta pelo QR Code (publicada no site da prefeitura).
; ATENÇÃO: o endereço fica gravado em cada QR Code emitido. Confirme com a equipe do site
; antes de emitir documentos e não mude depois, senão os documentos antigos deixam de abrir.
url = https://www.guarapari.es.gov.br/validar-autorizacao/

; Chave que assina os QR Codes (caminho relativo = pasta do .exe). Gerada UMA ÚNICA VEZ com:
;   EmissorAutorizacaoOnibus.exe --gerar-chave
; Faça cópia de segurança dela e nunca a envie por e-mail ou publique.
chave = chave_assinatura.pem
